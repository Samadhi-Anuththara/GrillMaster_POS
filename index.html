
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GrillMaster POS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>🍔 GrillMaster POS</h1>
        <p>Burger Shop Management System</p>
    </header>

    <!-- Navigation Menu -->
    <nav>
        <a href="#">Dashboard</a>
        <a href="#">New Order</a>
        <a href="#">Products</a>
        <a href="#">Customers</a>
        <a href="#">Orders</a>
    </nav>

    <!-- Main Content -->
    <main>

        <h2>Dashboard</h2>
        <p>Welcome to GrillMaster POS System!</p>

        <!-- Dashboard Cards -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Products</h3>
                <p>10</p>
            </div>

            <div class="card">
                <h3>Total Customers</h3>
                <p>25</p>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <p>50</p>
            </div>

            <div class="card">
                <h3>Total Sales</h3>
                <p>Rs. 25,000</p>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 GrillMaster POS | All Rights Reserved</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
